apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - crd.yaml
  - rbac.yaml
  - webhook.yaml
  - admission-policy.yaml
configMapGenerator:
  # Edit policy.yaml (or patch it in an overlay); KubeAmber reloads it within
  # about a minute of the ConfigMap changing, without restarting.
  - name: kubeamber-policy
    namespace: kubeamber-system
    files: [policy.yaml]
    options:
      disableNameSuffixHash: true
