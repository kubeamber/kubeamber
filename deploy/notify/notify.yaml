# Configuration for `kubeamber notify`. Reference: docs/integrations.md
# ("Notifications in Slack, Teams or any webhook"). The webhook URLs are
# secrets: keep them in the kubeamber-notify Secret, which is mounted at
# /etc/kubeamber/notify-secrets.
apiVersion: kubeamber.dev/v1alpha1
kind: NotifyConfig
metadata:
  name: default
spec:
  # Shown in every message, so a shared channel can tell clusters apart.
  cluster: my-cluster
  interval: 15s
  # One reminder for a change still waiting this long; "0s" turns it off.
  remindAfter: 15m
  channels:
    - name: platform
      slack: {urlFile: /etc/kubeamber/notify-secrets/slack-url}
    - name: oncall
      teams: {urlFile: /etc/kubeamber/notify-secrets/teams-url}
  routes:
    # The platform channel hears about everything.
    - channels: [platform]
    # On-call hears only about risky holds in production.
    - channels: [oncall]
      events: [held, reminder]
      minRisk: 60
      namespaces: [prod, "prod-*"]
