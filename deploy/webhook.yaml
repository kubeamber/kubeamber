apiVersion: v1
kind: Service
metadata:
  name: kubeamber
  namespace: kubeamber-system
  labels:
    app.kubernetes.io/name: kubeamber
spec:
  selector:
    app.kubernetes.io/name: kubeamber
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeamber
  namespace: kubeamber-system
  labels:
    app.kubernetes.io/name: kubeamber
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeamber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeamber
    spec:
      serviceAccountName: kubeamber
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubeamber
      containers:
        - name: kubeamber
          image: ghcr.io/kubeamber/kubeamber:v0.1.0
          args: [webhook, --policy=/etc/kubeamber/policy.yaml]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: SERVICE_ACCOUNT
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
            # Send traces and metrics to an OpenTelemetry Collector:
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability:4318
          ports:
            - name: https
              containerPort: 9443
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: policy
              mountPath: /etc/kubeamber
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: kubeamber-policy
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubeamber
  namespace: kubeamber-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeamber
---
# KubeAmber fills in caBundle and rewrites the kubeamber-agents match condition
# from the policy when it starts. Until then the condition below sends it
# nothing, and nothing is blocked.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubeamber
webhooks:
  - name: agents.kubeamber.dev
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    # Fail closed: if KubeAmber is down, agents wait. Humans and controllers
    # never reach this webhook, so they are unaffected.
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    clientConfig:
      service: {name: kubeamber, namespace: kubeamber-system, path: /validate}
    matchConditions:
      - name: kubeamber-agents
        expression: "false"
    rules:
      - operations: [CREATE, UPDATE, DELETE]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*", "*/scale", "pods/eviction", "serviceaccounts/token"]
        scope: "*"
      - operations: [CONNECT]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods/exec, pods/attach, pods/portforward]
  - name: changerequests.kubeamber.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    clientConfig:
      service: {name: kubeamber, namespace: kubeamber-system, path: /validate}
    matchConditions:
      - name: not-kubeamber
        expression: "request.userInfo.username != 'system:serviceaccount:kubeamber-system:kubeamber'"
    rules:
      - operations: [CREATE, UPDATE, DELETE]
        apiGroups: [kubeamber.dev]
        apiVersions: ["*"]
        resources: [changerequests]
        scope: Cluster
