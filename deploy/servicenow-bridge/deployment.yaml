# Create the credentials first, for example:
#   kubectl -n kubeamber-system create secret generic kubeamber-servicenow \
#     --from-literal=client-id=... --from-literal=client-secret=...
# or sync them from Vault with External Secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeamber-bridge
  namespace: kubeamber-system
  labels:
    app.kubernetes.io/name: kubeamber-bridge
spec:
  # One replica: opening tickets is idempotent, but there is no leader election yet.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeamber-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeamber-bridge
    spec:
      serviceAccountName: kubeamber-bridge
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bridge
          image: ghcr.io/kubeamber/kubeamber:v0.1.0
          args: [bridge, --config=/etc/kubeamber/bridge/bridge.yaml]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/kubeamber/bridge, readOnly: true}
            - {name: credentials, mountPath: /etc/kubeamber/servicenow, readOnly: true}
      volumes:
        - name: config
          configMap: {name: kubeamber-bridge}
        - name: credentials
          secret: {secretName: kubeamber-servicenow}
