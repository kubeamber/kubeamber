version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      kubernetes: {patterns: ["k8s.io/*"]}
      opentelemetry: {patterns: ["go.opentelemetry.io/*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # digestabot keeps the cgr.dev digests current, in every file, after
      # verifying Chainguard's signature (.github/workflows/digestabot.yaml).
      - dependency-name: "chainguard/*"
  - package-ecosystem: pip
    directory: /website
    schedule: {interval: weekly}
    groups:
      website: {patterns: ["*"]}
    ignore:
      # MkDocs 2.0 drops the plugin and hook system the site uses.
      - dependency-name: mkdocs
        versions: [">=2"]
