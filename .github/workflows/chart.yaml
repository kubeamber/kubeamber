name: chart
# On a v* tag, package the Helm chart at that version, push it to
# oci://ghcr.io/kubeamber/charts and sign it with Sigstore keyless signing.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and push
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/kubeamber --version "$version" --app-version "$GITHUB_REF_NAME" -d dist
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kubeamber-$version.tgz" oci://ghcr.io/kubeamber/charts 2>&1 | tee push.log
          echo "digest=$(grep -o 'sha256:[a-f0-9]*' push.log | head -1)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # cosign 3's bundle, plus the legacy .sig tag for verifiers that
          # don't read bundles yet (see release.yaml).
          chart="ghcr.io/kubeamber/charts/kubeamber@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$chart"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$chart"
