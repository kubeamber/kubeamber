name: release
# On a v* tag: build and push a signed multi-arch image with SBOM and
# provenance, and publish CLI binaries with signed checksums as a GitHub
# release. On pull requests that touch the build, do everything except
# publishing, so a broken release fails before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, hack/Dockerfile.local, Makefile, .github/workflows/release.yaml, go.mod, go.sum]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/kubeamber/kubeamber
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the base image
        run: make verify-base-images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >>"$GITHUB_OUTPUT"
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-pr${{ github.event.number }}" >>"$GITHUB_OUTPUT"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          push: ${{ steps.v.outputs.publish == 'true' }}
          provenance: mode=max
          sbom: true
      - name: Sign the image
        if: steps.v.outputs.publish == 'true'
        # Signed twice: cosign 3's bundle (an OCI 1.1 referrer), and the legacy
        # .sig tag that Sigstore policy-controller (up to v0.15.1) and other
        # admission verifiers still need. cosign verify accepts either.
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "${IMAGE}@${{ steps.build.outputs.digest }}"

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the checksums
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="v0.0.0-pr${{ github.event.number }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [[ $os == windows ]] && ext=".exe"
            dir="kubeamber_${version#v}_${os}_${arch}"
            mkdir -p "build/$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/kubeamber/kubeamber/internal/version.Version=${version}" \
              -o "build/$dir/kubeamber$ext" ./cmd/kubeamber
            cp LICENSE README.md "build/$dir/"
            if [[ $os == windows ]]; then
              (cd build && zip -qr "../dist/$dir.zip" "$dir")
            else
              tar -C build -czf "dist/$dir.tar.gz" "$dir"
            fi
          done
          (cd dist && sha256sum * >checksums.txt)
          cat dist/checksums.txt
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
