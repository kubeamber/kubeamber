# KubeAmber is one per cluster: its webhook configuration, admission policy
# and CRD are cluster-wide. Install it once, ideally in kubeamber-system.

image:
  repository: ghcr.io/kubeamber/kubeamber
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

webhook:
  replicas: 2
  # Fail closed: if KubeAmber is down, agents wait. Humans and controllers
  # never reach the webhook, so they are unaffected.
  failurePolicy: Fail
  timeoutSeconds: 5
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  podAnnotations: {}
  # Decisions to record as Kubernetes Events on the changed objects, shown by
  # `kubectl get events` and `kubectl describe`: a comma-separated list of
  # allow, hold, deny, approved and rejected, or "all". Empty turns Events off.
  events: hold,deny,approved,rejected
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Extra environment variables, for example to export telemetry:
  # - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #   value: http://otel-collector.observability:4318
  env: []
  tls:
    # By default KubeAmber creates its own serving certificate and keeps it in
    # a Secret. To use cert-manager or another issuer instead, name the
    # kubernetes.io/tls Secret here...
    existingSecret: ""
    # ...and either let cert-manager inject the CA (namespace/certificate)...
    certManagerCertificate: ""
    # ...or give the CA bundle (PEM) yourself.
    caBundle: ""

# Prometheus metrics: decisions by agent and outcome, and risk scores, served
# over plain HTTP on /metrics (docs/integrations.md#prometheus-and-grafana-alloy).
metrics:
  enabled: true
  port: 9090
  # Add prometheus.io/scrape, /port and /path annotations to the pods, for
  # Prometheus or Grafana Alloy setups that discover targets that way.
  scrapeAnnotations: true
  # Create a ServiceMonitor for the Prometheus Operator (its CRD must exist).
  # Grafana Alloy's prometheus.operator.servicemonitors component reads it too.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Labels your Prometheus selects ServiceMonitors by, e.g. release: prometheus.
    labels: {}
  # Create a PrometheusRule with KubeAmber's alerts (its CRD must exist):
  # webhook down, reviews near the timeout, an agent denied repeatedly, and
  # changes waiting for a person. The rules are in files/prometheus-rules.yaml.
  prometheusRule:
    enabled: false
    # Labels your Prometheus selects rules by, e.g. release: prometheus.
    labels: {}
    # Labels added to every alert, e.g. team: platform. They override the
    # rules' own labels, including severity.
    ruleLabels: {}
    # Alerts to leave out, by name, e.g. [KubeAmberChangesWaiting].
    disabled: []
  # Create a ConfigMap holding the KubeAmber Grafana dashboard, for Grafana's
  # dashboard sidecar (kube-prometheus-stack and the grafana chart run one).
  grafanaDashboard:
    enabled: false
    # Namespace the sidecar watches (default: the release namespace).
    namespace: ""
    # The label the sidecar looks for (its `sidecar.dashboards.label`).
    labels:
      grafana_dashboard: "1"
    # E.g. grafana_folder: KubeAmber, with the sidecar's folderAnnotation.
    annotations: {}

# Block agents from changing admission webhooks, which Kubernetes never sends
# to webhooks for review (docs/architecture.md). Strongly recommended.
admissionPolicy:
  enabled: true

# Create the namespace for agents' service accounts (kubeamber agent-kubeconfig
# puts them here). Kept on uninstall.
agentsNamespace:
  create: true
  name: kubeamber-agents

# Install the ChangeRequest CRD. It is kept on uninstall, with any held changes.
crds:
  install: true

# The policy KubeAmber enforces. Reference: docs/policy.md. KubeAmber reloads
# it within seconds of a `helm upgrade`, without restarting.
policy:
  apiVersion: kubeamber.dev/v1alpha1
  kind: Policy
  metadata:
    name: default
  spec:
    agents:
      # Every service account in the agents namespace.
      - name: sre-agent
        serviceAccounts: ["kubeamber-agents/*"]
      # Workstation agents whose kubeconfig carries this group.
      - name: workstation-agents
        groups: ["kubeamber:agents"]
    thresholds:
      hold: 30
      deny: 80
    protectedNamespaces: ["kube-system", "kube-public", "prod", "prod-*"]
    rules:
      - name: no-rbac-changes
        match:
          kinds: [Role, RoleBinding, ClusterRole, ClusterRoleBinding]
        action: deny
        reason: agents may not change RBAC, because that would let them grant themselves more power
    approvals:
      ttl: 15m
      pendingTTL: 1h

# The ServiceNow change-management bridge (docs/integrations.md).
bridge:
  enabled: false
  # Secret in the release namespace with client-id and client-secret (oauth),
  # or username and password (basic). Create it before enabling the bridge.
  credentialsSecret: kubeamber-servicenow
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config:
    interval: 15s
    # Keep in step with policy.spec.approvals.ttl.
    approvalTTL: 15m
    servicenow:
      instanceURL: https://YOUR-INSTANCE.service-now.com
      auth:
        type: oauth
        clientIDFile: /etc/kubeamber/servicenow/client-id
        clientSecretFile: /etc/kubeamber/servicenow/client-secret
      changeType: normal
      window: 24h
      closeState: review
      fields:
        category: Software
      configurationItems: {}

# Notifications in Slack, Microsoft Teams or any webhook: a message when an
# agent's change is held, a reminder, and when it is approved, rejected,
# applied or expires (docs/integrations.md#notifications-in-slack-teams-or-any-webhook).
notify:
  enabled: false
  # Secret in the release namespace with the webhook URLs, mounted at
  # /etc/kubeamber/notify-secrets. Create it before enabling notifications.
  secretName: kubeamber-notify
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config:
    # Shown in every message, so a shared channel can tell clusters apart.
    cluster: ""
    interval: 15s
    # One reminder for a change still waiting this long; "0s" turns it off.
    remindAfter: 15m
    # Each channel reads its URL from a file in the Secret above.
    channels: []
    # - name: platform
    #   slack: {urlFile: /etc/kubeamber/notify-secrets/slack-url}
    # - name: oncall
    #   teams: {urlFile: /etc/kubeamber/notify-secrets/teams-url}
    # - name: audit
    #   webhook:
    #     urlFile: /etc/kubeamber/notify-secrets/webhook-url
    #     secretFile: /etc/kubeamber/notify-secrets/webhook-signing-key
    # Without routes, every channel gets every message.
    routes: []
    # - channels: [platform]
    # - channels: [oncall]
    #   events: [held, reminder]
    #   minRisk: 60
    #   namespaces: [prod, "prod-*"]
