{{- /* dig: values reused from a release older than this setting lack it. */}}
{{- if and .Values.metrics.enabled (dig "grafanaDashboard" "enabled" false .Values.metrics) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeamber-grafana-dashboard
  namespace: {{ .Values.metrics.grafanaDashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubeamber.labels" . | nindent 4 }}
    app.kubernetes.io/name: kubeamber
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  kubeamber.json: |-
    {{- .Files.Get "files/grafana-dashboard.json" | trimSuffix "\n" | nindent 4 }}
{{- end }}
