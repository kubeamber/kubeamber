apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeamber
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeamber.labels" . | nindent 4 }}
    app.kubernetes.io/name: kubeamber
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeamber
  template:
    metadata:
      labels:
        {{- include "kubeamber.labels" . | nindent 8 }}
        app.kubernetes.io/name: kubeamber
      {{- $annotations := deepCopy (.Values.webhook.podAnnotations | default dict) }}
      {{- if and .Values.metrics.enabled .Values.metrics.scrapeAnnotations }}
      {{- $_ := merge $annotations (dict "prometheus.io/scrape" "true" "prometheus.io/port" (toString .Values.metrics.port) "prometheus.io/path" "/metrics") }}
      {{- end }}
      {{- with $annotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: kubeamber
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubeamber
      {{- with .Values.webhook.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webhook.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kubeamber
          image: {{ include "kubeamber.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - webhook
            - --policy=/etc/kubeamber/policy.yaml
            - --metrics-addr={{ if .Values.metrics.enabled }}:{{ .Values.metrics.port }}{{ end }}
            {{- if not .Values.admissionPolicy.enabled }}
            - --admission-policy=
            {{- end }}
            {{- if .Values.webhook.tls.existingSecret }}
            - --tls-cert-file=/etc/kubeamber/tls/tls.crt
            - --tls-key-file=/etc/kubeamber/tls/tls.key
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: SERVICE_ACCOUNT
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
            {{- with .Values.webhook.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: 9443
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 20
          resources: {{- toYaml .Values.webhook.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: policy, mountPath: /etc/kubeamber, readOnly: true}
            {{- if .Values.webhook.tls.existingSecret }}
            - {name: tls, mountPath: /etc/kubeamber/tls, readOnly: true}
            {{- end }}
      volumes:
        - name: policy
          configMap: {name: kubeamber-policy}
        {{- if .Values.webhook.tls.existingSecret }}
        - name: tls
          secret: {secretName: {{ .Values.webhook.tls.existingSecret }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeamber
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeamber.labels" . | nindent 4 }}
    app.kubernetes.io/name: kubeamber
spec:
  selector:
    app.kubernetes.io/name: kubeamber
  ports:
    - name: https
      port: 443
      targetPort: https
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
{{- if .Values.webhook.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubeamber
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kubeamber.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.webhook.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeamber
{{- end }}
